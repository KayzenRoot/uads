name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  foundation:
    name: Foundation checks
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Orchestrator eval
        run: npm run eval:orchestrator

      - name: Execution eval
        run: npm run eval:execution

      - name: Context eval
        run: npm run eval:context

      - name: Fault eval
        run: npm run eval:fault

      - name: Skills preflight
        run: npm run validate:skills

      - name: Validate foundation
        run: npm run validate
