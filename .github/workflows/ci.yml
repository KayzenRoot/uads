name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  foundation:
    name: Foundation checks
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Validate immutable action pins
        run: npm run validate:actions

      - name: Test
        run: npm test

      - name: Orchestrator eval
        run: npm run eval:orchestrator

      - name: Execution eval
        run: npm run eval:execution

      - name: Context eval
        run: npm run eval:context

      - name: Fault eval
        run: npm run eval:fault

      - name: Cost eval
        run: npm run eval:cost

      - name: Model routing eval
        run: npm run eval:model-routing

      - name: Skills preflight
        run: npm run validate:skills

      - name: Validate foundation
        run: npm run validate

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Packaging smoke test
        run: npm pack --dry-run
