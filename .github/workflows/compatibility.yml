name: UADS Cross-Platform Compatibility

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: compatibility-${{ github.event.workflow_run.head_sha || github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  compatibility:
    name: ${{ matrix.platform }} / Node 20
    if: ${{ github.event_name != 'workflow_run' || (github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.conclusion == 'success') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            runner: ubuntu-latest
          - platform: windows
            runner: windows-latest
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    steps:
      - name: Checkout exact source SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Setup Node.js 20
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck and build
        run: |
          npm run typecheck
          npm run build

      - name: Adapter and root-binding smoke
        run: npm run eval:adapters

      - name: Isolated global installation smoke
        run: node scripts/github/compatibility-smoke.mjs --platform ${{ matrix.platform }}

      - name: Write compatibility evidence
        if: always()
        env:
          UADS_COMPATIBILITY_STATUS: ${{ job.status }}
        run: node scripts/github/generate-compatibility-evidence.mjs --platform ${{ matrix.platform }} --output "${{ runner.temp }}/uads-compatibility-evidence.json"

      - name: Upload compatibility evidence
        if: always()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: uads-compatibility-${{ matrix.platform }}-${{ github.event.workflow_run.head_sha || github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/uads-compatibility-evidence.json
          retention-days: 90
          if-no-files-found: error
